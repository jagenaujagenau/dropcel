version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # effect and @effect/* share one exact beta pin; bump them together.
      effect-beta:
        patterns:
          - effect
          - "@effect/*"

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
